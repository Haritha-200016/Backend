<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mining Sensor Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

</head>

<body>

  <h1 id="dashboard-title">Mining Sensor Dashboard</h1>

  <div id="all-panels" class="panel-grid">
    <div id="tile-overview" class="panel-title" onclick="togglePanel('view', 'Overview')">
      <div class="panel-label">Overview</div>
      <img src="images/overview1.jpg" alt="Overview" class="panel-bg">
    </div>
    <div id="tile-fuel" class="panel-title" onclick="togglePanel('Fuel', 'Mine Planner')">
      <div class="panel-label">OCM Mine Planner</div>
      <img src="images/fm.jpg" alt="Mine Planner" class="panel-bg">
    </div>
    <div id="tile-env" class="panel-title" onclick="togglePanel('env', 'ENV Monitoring')">
      <div class="panel-label">OCM ENV Monitoring</div>
      <img src="images/env.png" alt="ENV Monitoring" class="panel-bg">
    </div>
    <div id="tile-machinery" class="panel-title" onclick="togglePanel('machinery', 'Machinery Analysis')">
      <div class="panel-label">OCM Machinery Analysis</div>
      <img src="images/ma2.jpeg" alt="Machinery Analysis" class="panel-bg">
    </div>
    <div id="tile-worker" class="panel-title" onclick="togglePanel('worker', 'Worker Safety')">
      <div class="panel-label">UG Worker Safety</div>
      <img src="images/worker safety.jpg" alt="Worker Safety" class="panel-bg">
    </div>
    <div id="tile-cm" class="panel-title" onclick="togglePanel('Continuous_minier', 'Continuous Miner')">
      <div class="panel-label">UG Continuous Miner</div>
      <img src="images/cm2.jpg" alt="Continuous Miner" class="panel-bg">
    </div>
    <div id="tile-ram" class="panel-title" onclick="togglePanel('Ram_car', 'Ram Car')">
      <div class="panel-label">UG Ram Car</div>
      <img src="images/ram.jpg" alt="Ram Car" class="panel-bg">
    </div>
    <div id="tile-dump" class="panel-title" onclick="togglePanel('Dump', 'Live Dump')">
      <div class="panel-label">UG Live Dump</div>
      <img src="images/ld.jpg" alt="Dump" class="panel-bg">
    </div>
    <div id="tile-prediction" class="panel-title" onclick="togglePanel('Prediction', 'Prediction Dashboard')">
      <div class="panel-label">Prediction Dashboard</div>
      <img src="images/pd2.jpg" alt="Prediction Dashboard" class="panel-bg">
    </div>
    <div id="tile-drone" class="panel-title" onclick="togglePanel('Drone', 'Drone Setup')">
      <div class="panel-label">OCM Drone Setup</div>
      <img src="images/drone-setup.jpg" alt="Drone Setup" class="panel-bg">
    </div>
  </div>

  <div id="panel-page" style="display:none;">
    <div id="panel-header-fixed">
      <button id="back-btn" onclick="goBack()">⬅ Back</button>
      <span id="panel-title-heading">Overview</span>
    </div>
    <div id="panel-content"></div>
  </div>

  <script>
    // ==================== CONFIGURATION ====================
    const BASE_URL = 'http://10.95.231.245:5001';
    const params = new URLSearchParams(window.location.search);
    const sector = params.get('sector') || 'Mining';
    const company = (params.get('company') || 'TMC').trim();
    let region = (params.get('region') || 'Churcha West').trim();
    const device_id = params.get('device_id') || '';
    const API_URL = `${BASE_URL}/fetchDashboardDataby?company=${encodeURIComponent(company)}&sector=${encodeURIComponent(sector)}&region=${encodeURIComponent(region)}&device_id=${encodeURIComponent(device_id)}`;
    let cachedData = null;

    // ==================== DOM READY ====================
document.addEventListener("DOMContentLoaded", () => {
    // Get region from URL
    const params = new URLSearchParams(window.location.search);
    const region = params.get('region') || '';
    
    console.log("📍 Region detected:", region);
    
    // Get all panel titles
    const allPanels = document.querySelectorAll("#all-panels .panel-title");
    
    // By default, show all panels
    allPanels.forEach(el => {
        el.style.display = "block";
    });
    
    // Region-specific filtering
    if (region === "Kache") {
        // Show ONLY Fuel panel (tile-fuel)
        allPanels.forEach(el => {
            if (el.id !== "tile-fuel") {
                el.style.display = "none";
            }
        });
        console.log("🔧 Kache region: Showing only Fuel panel");
    } 
    else if (region === "Tilaboni Mine") {
        // Show ONLY Dump panel (tile-dump)
        allPanels.forEach(el => {
            if (el.id !== "tile-dump") {
                el.style.display = "none";
            }
        });
        console.log("🔧 Tilaboni Mine: Showing only Dump panel");
    }
    // For all other regions (Churcha West, Velastra, Bhilai, etc.) - show ALL panels
    else {
        console.log("🔧 Other region: Showing all panels");
    }
});

    // ==================== FETCH DATA ====================
    async function fetchData() {
      if (cachedData) return cachedData;
      try {
        const res = await fetch(API_URL, {
          method: 'GET',
          mode: 'cors',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }
        });
        if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
        const json = await res.json();
        console.log("Fetched data:", json);

        // Handle different data structures
        if (json.status === 'success') {
          if (json.data && Array.isArray(json.data)) {
            cachedData = json.data;
          } else if (json.devices && Array.isArray(json.devices)) {
            if (json.devices.length > 0 && typeof json.devices[0] === 'object') {
              cachedData = json.devices;
            } else {
              // If devices is array of strings, create placeholder data
              console.log("Devices array is strings, creating placeholder data");
              cachedData = json.devices.map(deviceId => ({
                device_id: deviceId,
                timestamp: new Date().toISOString(),
                latitude: region === 'Velastra' ? 23.5 : 12.9567,
                longitude: region === 'Velastra' ? 87.3 : 77.73086,
                altitude: 0,
                pitch: 0,
                roll: 0,
                vibration: 0,
                movement: 'STABLE',
                load: 0,
                speed: 0
              }));
            }
          } else {
            cachedData = [];
          }
        } else {
          cachedData = [];
        }

        console.log("Processed data:", cachedData);
        return cachedData;
      } catch (err) {
        console.error("❌ Failed to fetch data:", err);
        cachedData = [];
        return [];
      }
    }
    
    // ==================== TOGGLE PANEL ====================
    function togglePanel(panelName, title) {
      document.getElementById('all-panels').style.display = 'none';
      document.getElementById('dashboard-title').style.display = 'none';
      document.getElementById('panel-page').style.display = 'block';
      document.getElementById('panel-title-heading').textContent = title;

      const content = document.getElementById('panel-content');
      if (panelName === 'view') renderOverview(content);
      else if (panelName === 'Fuel') renderFuel(content);
      else if (panelName === 'env') renderEnv(content);
      else if (panelName === 'machinery') renderMachinery(content);
      else if (panelName === 'worker') renderWorker(content);
      else if (panelName === 'Continuous_minier') renderContinuousMiner(content);
      else if (panelName === 'Ram_car') renderRamCar(content);
      else if (panelName === 'Dump') renderDump(content);
      else if (panelName === 'Prediction') renderPrediction(content);
      else if (panelName === 'Drone') renderDroneStream(content);
    }

    // ==================== GO BACK ====================
    function goBack() {
      document.getElementById('all-panels').style.display = 'flex';
      document.getElementById('dashboard-title').style.display = 'block';
      document.getElementById('panel-page').style.display = 'none';
    }

    function retryFetch() {
      cachedData = null;
      renderOverview(document.getElementById('panel-content'));
    }

    // ==================== SHARED UTILITY FUNCTIONS ====================
    function clamp(val, min, max) {
      return Math.min(Math.max(val, min), max);
    }

    function fmt(val, decimals = 1) {
      if (val === null || val === undefined) return '—';
      return Number(val).toFixed(decimals);
    }

    function statusClass(txt = '') {
      const v = (txt || '').toString().toLowerCase();
      if (v.includes('fault') || v.includes('fail')) return 'bad';
      if (v.includes('warn') || v.includes('alert')) return 'warn';
      return 'ok';
    }

    // ==================== REUSABLE METRIC ROWS FOR CONTINOUS MINER AND RAM CAR ====================
    function createMetricRow({ title, value, unit = '', percent = 0, colorClass = 'c-green' }) {
      const colors = {
        'c-green': '#1abc9c', 'c-blue': '#3aa0ff', 'c-orange': '#e67e22',
        'c-red': '#e74c3c', 'c-yellow': '#ffb300', 'c-purple': '#9b59b6',
        'c-teal': '#09faca'
      };
      return `
        <div class="metric-row ${colorClass}">
          <div class="metric-main">
            <div class="metric-title">${title}</div>
            <div class="metric-value">${fmt(value, 0)} <span class="metric-unit">${unit}</span></div>
            <div class="metric-bar-track">
              <span class="metric-bar-fill" style="width: ${clamp(percent, 0, 100)}%; background: ${colors[colorClass] || '#1abc9c'};"></span>
            </div>
          </div>
        </div>
      `;
    }

    function createBatteryRow({ title, value, percent, color = '#1abc9c' }) {
      return `
        <div class="metric-row c-green">
          <div class="metric-donut" style="--p: ${clamp(percent, 0, 100)}; --col: ${color};">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 8a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2v1h1.2a.8.8 0 0 1 .8.8v4.4a.8.8 0 0 1-.8.8H19v1a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8zm3 1v6h10V9H5z"/>
            </svg>
          </div>
          <div class="metric-main">
            <div class="metric-title">${title}</div>
            <div class="metric-value">${fmt(value, 0)}<span class="metric-unit">%</span></div>
            <div class="metric-bar-track">
              <span class="metric-bar-fill" style="width: ${clamp(percent, 0, 100)}%; background: ${color};"></span>
            </div>
          </div>
        </div>
      `;
    }

    function createPillRow(title, text) {
      const cls = statusClass(text);
      const colors = {
        ok: 'pill-ok',
        warn: 'pill-warn',
        bad: 'pill-bad'
      };
      return `
        <div class="metric-row">
          <div class="metric-main">
            <div class="metric-title">${title}</div>
            <div class="pill ${colors[cls] || 'pill-ok'}">${text ?? '-'}</div>
          </div>
        </div>
      `;
    }

    function createDetailBox(title, text) {
      return `
        <div class="metric-row">
          <div class="metric-main">
            <div class="metric-title">${title}</div>
            <div class="detail-box">${(text && String(text).trim()) ? String(text) : '—'}</div>
          </div>
        </div>
      `;
    }

    // ==================== CHART HELPERS ====================

    // Main chart creator using Chart.js
    function createChart(containerId, chartTitle, labels, values, color, valueText, unit = '') {
      const element = document.getElementById(containerId);
      if (!element) return;

      const validValues = values.filter(v => v !== null && v !== undefined);
      if (validValues.length === 0) {
        element.innerHTML = `<div class="no-data">No data</div>`;
        return;
      }

      const div = document.createElement('div');
      div.className = 'mini-chart';
      div.innerHTML = `
        <div class="mini-chart-header">
          <span class="mini-chart-title">${chartTitle}</span>
          <span class="mini-chart-value">${valueText}</span>
        </div>
        <canvas></canvas>
      `;

      const formattedLabels = labels.map(label => {
        const date = new Date(label);
        if (isNaN(date)) return label;
        return `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
      });

      const maxVal = Math.max(...validValues);
      const minVal = Math.min(...validValues);
      const range = maxVal - minVal || 1;
      let stepSize = range / 5;

      if (stepSize < 1) stepSize = Math.ceil(stepSize * 10) / 10;
      else if (stepSize < 5) stepSize = Math.ceil(stepSize);
      else if (stepSize < 20) stepSize = Math.ceil(stepSize / 5) * 5;
      else stepSize = Math.ceil(stepSize / 10) * 10;

      const yMin = Math.max(0, minVal - range * 0.1);
      const yMax = maxVal + range * 0.1;

      const ctx = div.querySelector('canvas').getContext('2d');
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: formattedLabels,
          datasets: [{
            label: chartTitle,
            data: values,
            borderColor: color,
            backgroundColor: `${color}20`,
            tension: 0.3,
            fill: true,
            borderWidth: 2,
            pointRadius: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: function(context) {
                  return context.parsed.y.toFixed(1) + (unit ? ' ' + unit : '');
                }
              }
            }
          },
          scales: {
            x: {
              display: true,
              ticks: { color: '#666', font: { size: 8 }, maxTicksLimit: 6 },
              grid: { display: false }
            },
            y: {
              display: true,
              ticks: {
                color: '#666',
                font: { size: 8 },
                stepSize: stepSize,
                maxTicksLimit: 6,
                callback: function(value) { return Number(value.toFixed(1)); }
              },
              grid: { display: false },
              min: yMin,
              max: yMax
            }
          }
        }
      });
      element.appendChild(div);
    }

    // History chart for continuous miner and ram car (uses Chart.js)
    function createHistoryChart(containerId, title, data, labels, color = '#ff6600', unit = '') {
      const container = document.getElementById(containerId);
      if (!container) return;

      const validData = data.filter(v => v !== null && v !== undefined);
      if (validData.length === 0) {
        container.innerHTML = '<div class="no-data">No data available</div>';
        return;
      }

      const div = document.createElement('div');
      div.className = 'history-chart';
      
      const latest = data[data.length - 1] || 0;
      div.innerHTML = `
        <div class="history-chart-header">
          <span class="history-chart-title">${title}</span>
          <span class="history-chart-value">${fmt(latest, 0)}${unit}</span>
        </div>
        <canvas></canvas>
      `;

      container.appendChild(div);

      const ctx = div.querySelector('canvas').getContext('2d');
      const formattedLabels = labels.map(label => {
        const date = new Date(label);
        if (isNaN(date)) return label;
        return `${String(date.getMinutes()).padStart(2, '0')}:${String(date.getSeconds()).padStart(2, '0')}`;
      });

      const maxVal = Math.max(...validData);
      const minVal = Math.min(...validData);
      const range = maxVal - minVal || 1;
      let stepSize = range / 5;
      if (stepSize < 1) stepSize = Math.ceil(stepSize * 10) / 10;
      else if (stepSize < 5) stepSize = Math.ceil(stepSize);
      else if (stepSize < 20) stepSize = Math.ceil(stepSize / 5) * 5;
      else stepSize = Math.ceil(stepSize / 10) * 10;

      const yMin = Math.max(0, minVal - range * 0.1);
      const yMax = maxVal + range * 0.1;

      new Chart(ctx, {
        type: 'line',
        data: {
          labels: formattedLabels,
          datasets: [{
            label: title,
            data: data,
            borderColor: color,
            backgroundColor: `${color}20`,
            tension: 0.3,
            fill: true,
            borderWidth: 2,
            pointRadius: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: function(context) {
                  return context.parsed.y.toFixed(1) + (unit ? ' ' + unit : '');
                }
              }
            }
          },
          scales: {
            x: {
              display: true,
              ticks: { color: '#666', font: { size: 8 }, maxTicksLimit: 6 },
              grid: { display: false }
            },
            y: {
              display: true,
              ticks: {
                color: '#666',
                font: { size: 8 },
                stepSize: stepSize,
                maxTicksLimit: 6,
                callback: function(value) { return Number(value.toFixed(1)); }
              },
              grid: { display: false },
              min: yMin,
              max: yMax
            }
          }
        }
      });
    }

    // ==================== RENDER OVERVIEW ====================
    async function renderOverview(container) {
      container.innerHTML = `<div class="loading">⏳ Loading Overview data...</div>`;

      const data = await fetchData();
      if (!data || data.length === 0) {
        container.innerHTML = `
          <div class="error-state">
            ❌ No data available<br>
            <small>URL: ${API_URL}</small><br><br>
            <button onclick="retryFetch()" class="retry-btn">Retry</button>
          </div>
        `;
        return;
      }

      data.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
      const latest = data[data.length - 1] || {};

      container.innerHTML = `
        <div class="dashboard1">
          <div class="card">
            <h2>Open-Pit and Underground Mining</h2>
            <div id="chart-blast-areas"></div>
            <div id="chart-development-meters"></div>
            <div id="chart-production-meters"></div>
            <div id="chart-ore-mined"></div>
          </div>
          <div class="card">
            <h2>Crushing & Processing Plant</h2>
            <div id="chart-throughput"></div>
            <div id="chart-crusher-availability"></div>
            <div id="chart-mill-vibration"></div>
            <div id="chart-power-consumption"></div>
          </div>
          <div class="card">
            <h2>Contractor Equipment</h2>
            <div id="chart-dump-trucks"></div>
            <div id="chart-excavators"></div>
            <div id="chart-drills"></div>
            <br>
            <div class="flex justify-between mb-2 text-lg"><span>Dump Trucks</span><span class="big-value">${latest.dump_trucks_utilization ? latest.dump_trucks_utilization.toFixed(0) : 88}%</span></div>
            <div class="flex justify-between mb-2 text-lg"><span>Excavators</span><span class="big-value">${latest.excavators_utilization ? latest.excavators_utilization.toFixed(0) : 73}%</span></div>
            <div class="flex justify-between text-lg"><span>Drills</span><span class="big-value">${latest.drills_utilization ? latest.drills_utilization.toFixed(0) : 61}%</span></div>
          </div>
          <div class="card">
            <h2>Utilization</h2>
            <div class="value mb-1">${latest.dump_trucks_utilization ? latest.dump_trucks_utilization.toFixed(0) : 27}%</div>
            <div class="sub-label mb-2">Exploration Completed</div>
            <div class="chart-box"><canvas id="utilizationChart"></canvas></div>
          </div>
          <div class="card">
            <h2>Exploration</h2>
            <div class="chart-box donut-box">
              <canvas id="explorationPie"></canvas>
              <div class="donut-center"><span class="donut-text">${latest.dump_trucks_utilization ? latest.dump_trucks_utilization.toFixed(0) : 27}%</span></div>
            </div>
            <div class="mt-4 stats-grid">
              <div class="stat-item"><span class="sub-label">Exploration Expenditure</span><span class="stat-value">$380K</span></div>
              <div class="stat-item"><span class="sub-label">Higher Utilization</span><span class="stat-value">10.2%</span></div>
              <div class="stat-item"><span class="sub-label">Completed Targets</span><span class="stat-value">22</span></div>
            </div>
          </div>
          <div class="card">
            <h2>Production vs. Plan</h2>
            <div class="progress-list">
              <div class="progress-item"><div class="progress-label">Dump Trucks <span class="float-right">${latest.dump_trucks_utilization ? latest.dump_trucks_utilization.toFixed(0) : 68}%</span></div><div class="progress-track"><div class="progress-fill" style="width: ${latest.dump_trucks_utilization ? latest.dump_trucks_utilization.toFixed(0) : 68}%;"></div></div></div>
              <div class="progress-item"><div class="progress-label">Excavators <span class="float-right">${latest.excavators_utilization ? latest.excavators_utilization.toFixed(0) : 73}%</span></div><div class="progress-track"><div class="progress-fill" style="width: ${latest.excavators_utilization ? latest.excavators_utilization.toFixed(0) : 73}%;"></div></div></div>
              <div class="progress-item"><div class="progress-label">Drills <span class="float-right">${latest.drills_utilization ? latest.drills_utilization.toFixed(0) : 61}%</span></div><div class="progress-track"><div class="progress-fill" style="width: ${latest.drills_utilization ? latest.drills_utilization.toFixed(0) : 61}%;"></div></div></div>
              <div class="progress-item"><div class="progress-label">Loaders <span class="float-right">79%</span></div><div class="progress-track"><div class="progress-fill" style="width: 79%;"></div></div></div>
            </div>
          </div>
          <div class="card">
            <h2>Production vs Plan</h2>
            <div class="chart-box"><canvas id="productionChart"></canvas></div>
          </div>
        </div>
      `;

      setTimeout(() => {
        const timestamps = data.map(d => d.timestamp);

        const overviewCharts = [
          { id: 'chart-blast-areas', title: 'Active Blast Areas', key: 'active_blast_areas', color: '#ff6b6b', unit: '' },
          { id: 'chart-development-meters', title: 'Development Meters', key: 'development_meters', color: '#6bcB77', unit: ' m' },
          { id: 'chart-production-meters', title: 'Production Meters', key: 'production_meters', color: '#4D96FF', unit: ' m' },
          { id: 'chart-ore-mined', title: 'Ore Mined', key: 'ore_mined', color: '#FFC300', unit: ' kt' },
          { id: 'chart-throughput', title: 'Throughput', key: 'throughput', color: '#AA96DA', unit: ' t/hr' },
          { id: 'chart-crusher-availability', title: 'Crusher Availability', key: 'crusher_availability', color: '#F67280', unit: ' %' },
          { id: 'chart-mill-vibration', title: 'Mill Vibration', key: 'mill_vibration', color: '#355C7D', unit: ' dB' },
          { id: 'chart-power-consumption', title: 'Power Consumption', key: 'fuel_consumption', color: '#6bcB77', unit: ' kW' },
          { id: 'chart-dump-trucks', title: 'Dump Trucks', key: 'dump_trucks_utilization', color: '#6bcB77', unit: ' %' },
          { id: 'chart-excavators', title: 'Excavators', key: 'excavators_utilization', color: '#AA96DA', unit: ' %' },
          { id: 'chart-drills', title: 'Drills', key: 'drills_utilization', color: '#FFC300', unit: ' %' }
        ];

        overviewCharts.forEach(chart => {
          const values = data.map(d => d[chart.key]);
          const latestValue = latest[chart.key] || 0;
          createChart(chart.id, chart.title, timestamps, values, chart.color,
            `${typeof latestValue === 'number' ? latestValue.toFixed(1) : latestValue}${chart.unit}`,
            chart.unit);
        });

        // Static charts
        const ctxUtil = document.getElementById('utilizationChart');
        if (ctxUtil) {
          new Chart(ctxUtil.getContext('2d'), {
            type: 'bar',

            const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
            dirLight2.position.set(-5, -10, -7);

            state.controls = new THREE.OrbitControls(camera, state.renderer.domElement);
            state.controls.enableDamping = true;
            state.controls.dampingFactor = 0.25;
            state.controls.rotateSpeed = 0.5;

            const loader = new THREE.PLYLoader();
            loader.load(
              '/models/scene_dense_mesh_textured.ply',
              (geometry) => {
                if (elements.loadingText) elements.loadingText.textContent = 'Applying texture...';
                geometry.computeVertexNormals();

                const textureLoader = new THREE.TextureLoader();
                textureLoader.load(
                  '/models/scene_dense_mesh_textured0.png',
                  (texture) => {
                    texture.flipY = true;
                    texture.encoding = THREE.sRGBEncoding;

                    const material = new THREE.MeshBasicMaterial({
                      map: texture,
                      side: THREE.DoubleSide
                    });

                    const mesh = new THREE.Mesh(geometry, material);

                    geometry.computeBoundingBox();
                    const box = geometry.boundingBox;
                    const center = new THREE.Vector3();
                    box.getCenter(center);
                    mesh.position.sub(center);

                    const size = new THREE.Vector3();
                    box.getSize(size);
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const scale = 5 / maxDim;
                    mesh.scale.multiplyScalar(scale);

                    scene.add(mesh);

                    if (elements.loading3D) elements.loading3D.style.display = 'none';
                    state.threeJsInitialized = true;

              (xhr) => {

              },
              (error) => {

                if (elements.loadingText) elements.loadingText.textContent = 'Error loading 3D model';
              }
            );

            function animate() {
              state.animationId = requestAnimationFrame(animate);

              if (state.renderer && scene && camera) state.renderer.render(scene, camera);
            }

            function handleResize() {
              if (!elements.drone3D) return;
              const w = elements.drone3D.clientWidth;
              const h = elements.drone3D.clientHeight;
              camera.aspect = w / h;
              camera.updateProjectionMatrix();
              if (state.renderer) {
                state.renderer.setSize(w, h, false);
                state.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
              }

              clearTimeout(resizeTimeout);
              resizeTimeout = setTimeout(handleResize, 250);

            const resizeObserver = new ResizeObserver(debouncedResize);
            if (elements.drone3D?.parentElement) {
              resizeObserver.observe(elements.drone3D.parentElement);
            }

            state.threeJSCleanup = () => {
              window.removeEventListener('resize', debouncedResize);
              resizeObserver?.disconnect();
              if (state.animationId) cancelAnimationFrame(state.animationId);
              if (state.controls) state.controls.dispose();
              if (state.renderer) state.renderer.dispose();
              state.threeJsInitialized = false;
            };

          } catch (error) {

    // ==================== FUEL MAP FUNCTION ====================
    function initializeFuelMap(data) {
    const mapContainer = document.getElementById('fuelMap');
    if (!mapContainer) return;

    window.currentMapData = data || [];
    console.log("📊 Current data:", data);

    // Extract valid coordinates from current data (latest positions)
    const validLocations = [];
    data.forEach(item => {
        const lat = parseFloat(item.latitude);
        const lng = parseFloat(item.longitude);
        const deviceId = item.device_id || item.Device_ID || item.id || 'Unknown';
        
        if (!isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0) {
            validLocations.push({ 
                lat, 
                lng, 
                device: item,
                deviceId: deviceId,
                timestamp: item.timestamp || new Date().toISOString()
            });
        }
    });

    // Store valid locations
    window.validLocations = validLocations;

    let centerLat = 23.5;
    let centerLng = 87.3;
    let zoom = 14;

    if (validLocations.length > 0) {
        const avgLat = validLocations.reduce((s, loc) => s + loc.lat, 0) / validLocations.length;
        const avgLng = validLocations.reduce((s, loc) => s + loc.lng, 0) / validLocations.length;
        centerLat = avgLat;
        centerLng = avgLng;
    }

    // Initialize map
    const map = L.map('fuelMap', {
        zoomControl: true,
        dragging: true,
        touchZoom: true,
        scrollWheelZoom: true
    }).setView([centerLat, centerLng], zoom);

    window.fuelMap = map;

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        maxZoom: 19
    }).addTo(map);

    // Add all device markers (current positions)
    allMapMarkers = [];
    validLocations.forEach(loc => {
        const marker = L.marker([loc.lat, loc.lng]).addTo(map);
        allMapMarkers.push(marker);
        
        const deviceId = loc.device?.device_id || loc.device?.Device_ID || 'Unknown';
        marker.bindPopup(`
            <div style="color:#000;">
                <strong>${deviceId}</strong><br>
                Lat: ${loc.lat.toFixed(4)}<br>
                Lng: ${loc.lng.toFixed(4)}
            </div>
        `);
    });

    if (validLocations.length > 1) {
        const bounds = validLocations.map(loc => [loc.lat, loc.lng]);
        map.fitBounds(bounds, { padding: [50, 50] });
    }

    // ========== FETCH DAILY DATA FOR PATH ==========
    fetchDailyDataForPath().then(dailyData => {
        if (dailyData && dailyData.length > 0) {
            console.log("✅ Daily data loaded:", dailyData.length, "records");
            // Store daily data globally for path drawing
            window.dailyPathData = dailyData;
        } else {
            console.log("⚠️ No daily data available, using current data only");
            window.dailyPathData = [];
        }
    }).catch(err => {
        console.error("❌ Error fetching daily data:", err);
        window.dailyPathData = [];
    });
    // =============================================

    setTimeout(() => {
        map.invalidateSize();
    }, 100);

    window.addEventListener('resize', () => {
        map.invalidateSize();
    });
}

// ==================== REPORT DOWNLOAD FUNCTION ====================
    async function downloadReport(timeRange, shift = null) {
        try {
            // Create loading overlay
            const overlay = document.createElement('div');
            overlay.id = 'downloadLoadingOverlay';
            overlay.innerHTML = `
                <div class="download-loading-modal">
                    <div class="loading-spinner-container">
                        <div class="loading-spinner-ring"></div>
                        <div class="loading-spinner-ring"></div>
                        <div class="loading-spinner-ring"></div>
                    </div>
                    <div class="loading-title">Generating Report</div>
                    <div class="loading-progress-container">
                        <div class="loading-progress-bar" id="downloadProgressBar"></div>
                    </div>
                    <div class="loading-status" id="downloadStatus">⏳ Preparing data...</div>
                    <div class="loading-percentage" id="downloadPercentage">0%</div>
                    <div class="loading-details" id="downloadDetails">${timeRange}${shift ? ' - ' + shift.charAt(0).toUpperCase() + shift.slice(1) + ' Shift' : ''}</div>
                </div>
            `;
            document.body.appendChild(overlay);

            // Get button references for updating status
            const statusEl = document.getElementById('downloadStatus');
            const progressBar = document.getElementById('downloadProgressBar');
            const percentageEl = document.getElementById('downloadPercentage');

            // Update progress function
            function updateProgress(message, percent) {
                if (statusEl) statusEl.textContent = message;
                if (progressBar) progressBar.style.width = `${Math.min(percent, 100)}%`;
                if (percentageEl) percentageEl.textContent = `${Math.min(percent, 100)}%`;
            }

            // Initial progress
            updateProgress('⏳ Preparing data...', 10);

            // Get current parameters from URL
            const params = new URLSearchParams(window.location.search);
            const region = params.get('region') || 'Churcha West';
            const company = params.get('company') || 'TMC';
            const sector = params.get('sector') || 'Mining';
            
            // Build the URL with all required parameters
            let url = `${BASE_URL}/generateAnalysisReport?`;
            url += `timeRange=${encodeURIComponent(timeRange)}`;
            url += `&company=${encodeURIComponent(company)}`;
            url += `&sector=${encodeURIComponent(sector)}`;
            url += `&region=${encodeURIComponent(region)}`;
            
            // Add shift parameter if provided
            if (shift) {
                let shiftParam = '';
                if (shift === 'morning') shiftParam = '6am-2pm';
                else if (shift === 'afternoon') shiftParam = '2pm-10pm';
                else if (shift === 'night') shiftParam = '10pm-6am';
                else shiftParam = shift;
                url += `&shift=${encodeURIComponent(shiftParam)}`;
            }
            
            console.log(`📊 Downloading report: ${timeRange}${shift ? ' - ' + shift : ''}`);
            console.log(`🔗 URL: ${url}`);
            console.log(`📍 Company: ${company}, Sector: ${sector}, Region: ${region}`);
            
            updateProgress('📊 Fetching data from server...', 30);

            // Disable buttons
            const buttons = document.querySelectorAll('.fuel-btn');
            buttons.forEach(btn => {
                btn.disabled = true;
                btn.style.opacity = '0.6';
                btn.style.cursor = 'not-allowed';
            });
            
            // Fetch the report
            const response = await fetch(url, {
                method: 'GET',
                headers: {
                    'Accept': 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
                }
            });
            
            updateProgress('📈 Processing report data...', 60);
            
            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`HTTP error! status: ${response.status}, message: ${errorText}`);
            }
            
            updateProgress('📋 Building Excel file...', 80);
            
            // Get the filename
            const contentDisposition = response.headers.get('Content-Disposition');
            let filename = `report_${company}_${region}_${timeRange}${shift ? '_' + shift : ''}_${new Date().toISOString().split('T')[0]}.xlsx`;
            
            if (contentDisposition) {
                const match = contentDisposition.match(/filename="([^"]+)"/);
                if (match) filename = match[1];
            }
            
            // Get the blob data
            const blob = await response.blob();
            
            updateProgress('💾 Downloading file...', 90);
            
            // Create download link
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            
            // Clean up
            setTimeout(() => {
                URL.revokeObjectURL(link.href);
                document.body.removeChild(link);
            }, 1000);
            
            updateProgress('✅ Download complete!', 100);
            
            console.log(`✅ Report downloaded: ${filename}`);
            
            // Show success state
            const titleEl = overlay.querySelector('.loading-title');
            if (titleEl) {
                titleEl.textContent = '✅ Download Complete!';
                titleEl.style.color = '#4caf50';
            }
            
            // Close overlay after 2 seconds
            setTimeout(() => {
                if (overlay && overlay.parentNode) {
                    overlay.style.opacity = '0';
                    overlay.style.transition = 'opacity 0.5s ease';
                    setTimeout(() => {
                        if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
                    }, 500);
                }
            }, 2000);
            
        } catch (error) {
            console.error('❌ Error downloading report:', error);
            
            // Show error in overlay
            const statusEl = document.getElementById('downloadStatus');
            const titleEl = document.querySelector('.loading-title');
            const progressBar = document.getElementById('downloadProgressBar');
            const percentageEl = document.getElementById('downloadPercentage');
            
            if (statusEl) {
                statusEl.textContent = '❌ ' + error.message;
                statusEl.style.color = '#ff6b6b';
            }
            if (titleEl) {
                titleEl.textContent = '❌ Download Failed';
                titleEl.style.color = '#ff6b6b';
            }
            if (progressBar) {
                progressBar.style.width = '100%';
                progressBar.style.background = '#ff6b6b';
            }
            if (percentageEl) {
                percentageEl.textContent = 'Error';
                percentageEl.style.color = '#ff6b6b';
            }
            
            // Close overlay after 3 seconds
            const overlay = document.getElementById('downloadLoadingOverlay');
            if (overlay) {
                setTimeout(() => {
                    overlay.style.opacity = '0';
                    overlay.style.transition = 'opacity 0.5s ease';
                    setTimeout(() => {
                        if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
                    }, 500);
                }, 3000);
            }
            
            alert(`Failed to download report: ${error.message}`);
        } finally {
            // Reset button states
            const buttons = document.querySelectorAll('.fuel-btn');
            buttons.forEach(btn => {
                btn.disabled = false;
                btn.style.opacity = '1';
                btn.style.cursor = 'pointer';
            });
        }
    }  
  
    // ==================== DEVICE LIST FUNCTIONS ====================
      let selectedDeviceId = null;
      let selectedMarker = null;
      let allMapMarkers = [];

      // Toggle device list visibility
      function toggleDeviceList() {
          const container = document.getElementById('deviceListContainer');
          if (container.style.display === 'block') {
              container.style.display = 'none';
          } else {
              container.style.display = 'block';
              loadDeviceList();
          }
      }

      // Load and display device IDs - ONLY those with valid coordinates
      function loadDeviceList() {
          const content = document.getElementById('deviceListContent');
          if (!content) return;
          
          const data = window.currentMapData;
          
          if (!data || data.length === 0) {
              content.innerHTML = '<div style="padding: 10px; color: rgba(255,255,255,0.5); text-align: center;">No devices found</div>';
              return;
          }
          
          // Get unique device IDs that have valid coordinates
          const deviceIds = new Set();
          data.forEach(device => {
              const lat = parseFloat(device.latitude);
              const lng = parseFloat(device.longitude);
              const id = device.device_id || device.Device_ID || device.id;
              
              // Only add if device has valid coordinates
              if (id && !isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0) {
                  deviceIds.add(id);
              }
          });
          
          if (deviceIds.size === 0) {
              content.innerHTML = '<div style="padding: 10px; color: rgba(255,255,255,0.5); text-align: center;">No devices with GPS data</div>';
              return;
          }
          
          // Build the list
          let html = '';
          deviceIds.forEach(deviceId => {
              const isSelected = selectedDeviceId === deviceId;
              html += `
                  <div class="device-item ${isSelected ? 'selected' : ''}" onclick="selectDevice('${deviceId}')">
                      📡 ${deviceId}
                      ${isSelected ? ' ✓' : ''}
                  </div>
              `;
          });
          
          content.innerHTML = html;
      }

      // Select a device
      function selectDevice(deviceId) {
          selectedDeviceId = deviceId;
          
          // Hide the device list
          const container = document.getElementById('deviceListContainer');
          if (container) {
              container.style.display = 'none';
          }
          
          // Find the device in the data
          const device = window.currentMapData.find(d => {
              const id = d.device_id || d.Device_ID || d.id;
              return id === deviceId;
          });
          
          if (device) {
              // Update map - show only this device
              updateMapForDevice(device);
              
              // Update mine haul dashboard
              updateMineHaulDashboard(device);
          }
      }

      // Update map for selected device
      function updateMapForDevice(device) {
          if (!window.fuelMap) return;
          
          const lat = parseFloat(device.latitude);
          const lng = parseFloat(device.longitude);
          const deviceId = device.device_id || device.Device_ID || device.id;
          
          console.log("🔍 Selected device:", deviceId);
          
          // Clear all markers
          allMapMarkers.forEach(marker => {
              window.fuelMap.removeLayer(marker);
          });
          allMapMarkers = [];
          
          // Clear selected marker
          if (selectedMarker) {
              window.fuelMap.removeLayer(selectedMarker);
              selectedMarker = null;
          }
          
          // Clear existing path
          if (window.pathLayer) {
              window.fuelMap.removeLayer(window.pathLayer);
              window.pathLayer = null;
          }
          
          // Get points for this device
          let devicePoints = [];
          
          // Try to get from daily data first
          if (window.dailyPathData && window.dailyPathData.length > 0) {
              console.log("📊 Using daily data, total records:", window.dailyPathData.length);
              
              devicePoints = window.dailyPathData
                  .filter(record => {
                      const id = record.device_id || record.Device_ID || record.id;
                      return id == deviceId;
                  })
                  .map(record => {
                      const lat2 = parseFloat(record.latitude);
                      const lng2 = parseFloat(record.longitude);
                      return {
                          lat: lat2,
                          lng: lng2,
                          deviceId: deviceId,
                          timestamp: record.timestamp || new Date().toISOString()
                      };
                  })
                  .filter(p => !isNaN(p.lat) && !isNaN(p.lng) && p.lat !== 0 && p.lng !== 0);
                  
              console.log("📊 Found", devicePoints.length, "points from daily data");
          }
          
          // If no daily data or no points, create test points
          if (devicePoints.length < 2) {
              console.log("📊 Not enough points, creating test points");
              
              const offsets = [
                  { lat: 0, lng: 0 },
                  { lat: 0.0005, lng: 0.0003 },
                  { lat: 0.0010, lng: 0.0008 },
                  { lat: 0.0008, lng: 0.0015 },
                  { lat: 0.0002, lng: 0.0012 }
              ];
              
              offsets.forEach((offset, index) => {
                  devicePoints.push({
                      lat: lat + offset.lat,
                      lng: lng + offset.lng,
                      deviceId: deviceId,
                      timestamp: new Date(Date.now() - (offsets.length - index) * 60000).toISOString()
                  });
              });
          }
          
          // Sort points by timestamp
          devicePoints.sort((a, b) => {
              const timeA = new Date(a.timestamp || 0);
              const timeB = new Date(b.timestamp || 0);
              return timeA - timeB;
          });
          
          // ========== FILTER OUT SUDDEN JUMPS > 1km ==========
          function haversineDistance(lat1, lon1, lat2, lon2) {
              const R = 6371; // Earth's radius in km
              const dLat = (lat2 - lat1) * Math.PI / 180;
              const dLon = (lon2 - lon1) * Math.PI / 180;
              const a = 
                  Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                  Math.sin(dLon/2) * Math.sin(dLon/2);
              const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
              return R * c;
          }
          
          if (devicePoints.length > 2) {
              const filteredPoints = [devicePoints[0]]; // Always keep first point
              
              for (let i = 1; i < devicePoints.length; i++) {
                  const prevPoint = filteredPoints[filteredPoints.length - 1];
                  const currentPoint = devicePoints[i];
                  const distance = haversineDistance(prevPoint.lat, prevPoint.lng, currentPoint.lat, currentPoint.lng);
                  
                  // Only add point if distance is <= 1km
                  if (distance <= 1) {
                      filteredPoints.push(currentPoint);
                  } else {
                      console.log(`🚫 Skipping jump of ${distance.toFixed(2)}km at point ${i}`);
                  }
              }
              
              console.log(`📊 Filtered: ${devicePoints.length} → ${filteredPoints.length} points (removed ${devicePoints.length - filteredPoints.length} jumps > 1km)`);
              devicePoints = filteredPoints;
          }
          // ===========================================================
          
          console.log("📊 Total points after filtering:", devicePoints.length);
          
          // ========== DRAW PATH ==========
          if (devicePoints.length >= 2) {
              const points = devicePoints.map(p => [p.lat, p.lng]);
              console.log("🛤️ Drawing path with", points.length, "points");
              
              window.pathLayer = L.polyline(points, {
                  color: '#ff6b35',
                  weight: 4,
                  opacity: 0.9
              }).addTo(window.fuelMap);
              
              console.log("✅ Path drawn!");
          }
          // =================================
          
          // ========== ADD SMALL DOT MARKERS FOR EACH POINT ==========
          devicePoints.forEach((loc, index) => {
              // Use circle markers (small dots) instead of raindrop icons
              const marker = L.circleMarker([loc.lat, loc.lng], {
                  radius: 4,
                  color: '#ff6b35',
                  fillColor: '#ff6b35',
                  fillOpacity: 0.8,
                  weight: 1
              }).addTo(window.fuelMap);
              
              allMapMarkers.push(marker);
              
              marker.bindPopup(`
                  <div style="color:#000;">
                      <strong>${deviceId}</strong><br>
                      Point #${index + 1}<br>
                      Lat: ${loc.lat.toFixed(6)}<br>
                      Lng: ${loc.lng.toFixed(6)}
                  </div>
              `);
          });
          // ===========================================================
          
          // ========== ADD START MARKER (GREEN) ==========
          if (devicePoints.length > 0) {
              const startIcon = L.divIcon({
                  className: 'custom-div-icon',
                  html: `
                      <div style="
                          background: #4caf50;
                          width: 14px;
                          height: 14px;
                          border-radius: 50%;
                          border: 2px solid #ffffff;
                          box-shadow: 0 0 15px rgba(76, 175, 80, 0.5);
                      "></div>
                  `,
                  iconSize: [14, 14],
                  iconAnchor: [7, 7]
              });
              
              const startMarker = L.marker([devicePoints[0].lat, devicePoints[0].lng], { 
                  icon: startIcon 
              }).addTo(window.fuelMap);
              
              allMapMarkers.push(startMarker);
              startMarker.bindPopup('🏁 Start Point');
          }
          // ==============================================
          
          // ========== ADD END MARKER (RED) ==========
          if (devicePoints.length > 1) {
              const endIcon = L.divIcon({
                  className: 'custom-div-icon',
                  html: `
                      <div style="
                          background: #f44336;
                          width: 14px;
                          height: 14px;
                          border-radius: 50%;
                          border: 2px solid #ffffff;
                          box-shadow: 0 0 15px rgba(244, 67, 54, 0.5);
                      "></div>
                  `,
                  iconSize: [14, 14],
                  iconAnchor: [7, 7]
              });
              
              const endMarker = L.marker([devicePoints[devicePoints.length - 1].lat, devicePoints[devicePoints.length - 1].lng], { 
                  icon: endIcon 
              }).addTo(window.fuelMap);
              
              allMapMarkers.push(endMarker);
              endMarker.bindPopup('🏁 End Point');
          }
          // ============================================
          
          // ========== SHOW HIGHLIGHT MARKER FOR CURRENT POSITION (BLUE/PURPLE) ==========
          if (lat && lng && !isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0) {
              const customIcon = L.divIcon({
                  className: 'custom-div-icon',
                  html: `
                      <div style="
                          background: #667eea;
                          width: 20px;
                          height: 20px;
                          border-radius: 50%;
                          border: 3px solid #ffffff;
                          box-shadow: 0 0 30px rgba(102, 126, 234, 0.8);
                          animation: pulseMarker 1.5s infinite;
                      "></div>
                  `,
                  iconSize: [20, 20],
                  iconAnchor: [10, 10]
              });
              
              selectedMarker = L.marker([lat, lng], { icon: customIcon }).addTo(window.fuelMap);
              allMapMarkers.push(selectedMarker);
              
              selectedMarker.bindPopup(`
                  <div style="color:#000; min-width:150px;">
                      <strong style="font-size:14px;">${deviceId}</strong><br>
                      <span style="font-size:12px;">
                          Lat: ${lat.toFixed(6)}<br>
                          Lng: ${lng.toFixed(6)}<br>
                          Status: ${device.movement || 'Unknown'}<br>
                          <span style="color:#667eea; font-weight:bold;">● Current Position</span>
                      </span>
                  </div>
              `);
              selectedMarker.openPopup();
              
              window.fuelMap.setView([lat, lng], 16);
          }
          // ========================================================================
      }
      
      // ==================== HAVERSINE DISTANCE CALCULATION ====================
      function haversineDistance(lat1, lon1, lat2, lon2) {
          const R = 6371; // Earth's radius in km
          const dLat = (lat2 - lat1) * Math.PI / 180;
          const dLon = (lon2 - lon1) * Math.PI / 180;
          const a = 
              Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
              Math.sin(dLon/2) * Math.sin(dLon/2);
          const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
          return R * c;
      }
      
      // Update Mine Haul Dashboard
      function updateMineHaulDashboard(device) {
    // Get pitch value for segment calculation
    const pitch = parseFloat(device.pitch) || 0;
    const lat = parseFloat(device.latitude);
    const lng = parseFloat(device.longitude);
    const deviceId = device.device_id || device.Device_ID || device.id || '—';
    
    // Calculate segments based on pitch
    let flatSegments = 0;
    let gradientSegments = 0;
    let totalSegments = 0;
    let totalDistance = 0;
    
    // Get all points for this device from daily data
    let devicePoints = [];
    if (window.dailyPathData && window.dailyPathData.length > 0) {
        devicePoints = window.dailyPathData
            .filter(record => {
                const id = record.device_id || record.Device_ID || record.id;
                return id == deviceId;
            })
            .map(record => {
                return {
                    lat: parseFloat(record.latitude),
                    lng: parseFloat(record.longitude),
                    pitch: parseFloat(record.pitch) || 0,
                    timestamp: record.timestamp || new Date().toISOString()
                };
            })
            .filter(p => !isNaN(p.lat) && !isNaN(p.lng) && p.lat !== 0 && p.lng !== 0);
    }
    
    // If no daily data, use the single device data
    if (devicePoints.length === 0 && lat && lng) {
        devicePoints.push({
            lat: lat,
            lng: lng,
            pitch: pitch,
            timestamp: device.timestamp || new Date().toISOString()
        });
    }
    
    // Sort by timestamp
    devicePoints.sort((a, b) => {
        const timeA = new Date(a.timestamp || 0);
        const timeB = new Date(b.timestamp || 0);
        return timeA - timeB;
    });
    
    // Calculate segments and distance
    if (devicePoints.length >= 2) {
        for (let i = 1; i < devicePoints.length; i++) {
            const prev = devicePoints[i - 1];
            const curr = devicePoints[i];
            
            // Calculate distance between points
            const dist = haversineDistance(prev.lat, prev.lng, curr.lat, curr.lng);
            
            // Only count if distance is <= 1km (skip jumps)
            if (dist <= 1) {
                totalDistance += dist;
                totalSegments++;
                
                // Check if pitch is flat (-8° to +8°)
                const pitchVal = curr.pitch || 0;
                if (pitchVal >= -8 && pitchVal <= 8) {
                    flatSegments++;
                } else {
                    gradientSegments++;
                }
            }
        }
    }
    
    // For single point or no data, use default values
    if (totalSegments === 0 && lat && lng) {
        // If only one point, check its pitch
        if (pitch >= -8 && pitch <= 8) {
            flatSegments = 1;
        } else {
            gradientSegments = 1;
        }
        totalSegments = 1;
    }
    
    // Map fields from your actual data structure
    const fields = {
        'mh_vehicle_id': deviceId,
        'mh_type': 'Hauler',  // Default to Hauler
        'mh_position': lat && lng ? 
            `${lat.toFixed(4)}, ${lng.toFixed(4)}` : '0, 0',
        'mh_altitude': device.altitude || device.Altitude || '0',
        'mh_rl': device.rl || device.RL || '0',
        'mh_gradient': pitch !== undefined && pitch !== null ? `${pitch}°` : '0',
        'mh_elevation': device.elevation || device.Elevation || 'Default',
        'mh_roll': device.roll || device.Roll || '0',
        'mh_distance': totalDistance > 0 ? `${(totalDistance * 1000).toFixed(0)} m` : '0',
        'mh_flat': flatSegments > 0 ? flatSegments : '0',
        'mh_gradient_seg': gradientSegments > 0 ? gradientSegments : '0',
        'mh_total_seg': totalSegments > 0 ? totalSegments : '0'
    };
    
    Object.keys(fields).forEach(id => {
        const element = document.getElementById(id);
        if (element) {
            const newValue = fields[id] !== undefined && fields[id] !== null && fields[id] !== '—' 
                ? String(fields[id]) 
                : '—';
            element.textContent = newValue;
        }
    });
}
      // Reset to show all devices (only those with valid coordinates)
      function resetToAllDevices() {
          selectedDeviceId = null;
          
          if (selectedMarker) {
              window.fuelMap.removeLayer(selectedMarker);
              selectedMarker = null;
          }
          
          // Clear all markers
          allMapMarkers.forEach(marker => {
              window.fuelMap.removeLayer(marker);
          });
          allMapMarkers = [];
          
          // Re-add only devices with valid coordinates
          const data = window.currentMapData;
          const validLocations = [];
          data.forEach(item => {
              const lat = parseFloat(item.latitude);
              const lng = parseFloat(item.longitude);
              if (!isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0) {
                  validLocations.push({ lat, lng, device: item });
              }
          });
          
          validLocations.forEach(loc => {
              const marker = L.marker([loc.lat, loc.lng]).addTo(window.fuelMap);
              allMapMarkers.push(marker);
              
              const deviceId = loc.device?.device_id || loc.device?.Device_ID || 'Unknown';
              marker.bindPopup(`
                  <div style="color:#000;">
                      <strong>${deviceId}</strong><br>
                      Lat: ${loc.lat.toFixed(4)}<br>
                      Lng: ${loc.lng.toFixed(4)}
                  </div>
              `);
          });
          
          // Fit bounds to show all devices
          if (validLocations.length > 1) {
              const bounds = validLocations.map(loc => [loc.lat, loc.lng]);
              window.fuelMap.fitBounds(bounds, { padding: [50, 50] });
          }
      }
      
      // ==================== FETCH DAILY DATA FOR PATH ====================
      async function fetchDailyDataForPath() {
          const params = new URLSearchParams(window.location.search);
          const region = params.get('region') || 'Churcha West';
          const company = params.get('company') || 'TMC';
          const sector = params.get('sector') || 'Mining';
          
          const url = `${BASE_URL}/getAllDevices-DailyData?region=${encodeURIComponent(region)}&company=${encodeURIComponent(company)}&sector=${encodeURIComponent(sector)}`;
          
          console.log("📡 Fetching daily data from:", url);
          
          try {
              const res = await fetch(url);
              const json = await res.json();
              console.log("📊 Daily data fetched:", json);
              
              if (json.status === 'success' && json.data && json.data.length > 0) {
                  console.log("✅ Found", json.data.length, "records for path");
                  return json.data;
              }
              console.log("⚠️ No daily data available");
              return [];
          } catch (err) {
              console.error("❌ Failed to fetch daily data:", err);
              return [];
          }
      }
